<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="190"
     viewBox="0 0 1280 190">

<defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
        <stop offset="0%" stop-color="#100A16"/>
        <stop offset="45%" stop-color="#1C1125"/>
        <stop offset="100%" stop-color="#0E0813"/>
    </linearGradient>

    <!-- Purple ambient glow -->
    <radialGradient id="purpleGlow">
        <stop offset="0%"
              stop-color="#C084FC"
              stop-opacity=".24"/>
        <stop offset="45%"
              stop-color="#A855F7"
              stop-opacity=".08"/>
        <stop offset="100%"
              stop-color="#A855F7"
              stop-opacity="0"/>
    </radialGradient>

    <!-- Pink ambient glow -->
    <radialGradient id="pinkGlow">
        <stop offset="0%"
              stop-color="#F0ABFC"
              stop-opacity=".18"/>
        <stop offset="50%"
              stop-color="#C0268C"
              stop-opacity=".05"/>
        <stop offset="100%"
              stop-color="#C0268C"
              stop-opacity="0"/>
    </radialGradient>

    <!-- Title gradient -->
    <linearGradient id="title"
                    x1="0" y1="0"
                    x2="1" y2="0">
        <stop offset="0%"
              stop-color="#F5D0FE"/>
        <stop offset="50%"
              stop-color="#E879F9"/>
        <stop offset="100%"
              stop-color="#C084FC"/>
    </linearGradient>

    <!-- Soft blur -->
    <filter id="blur"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
        <feGaussianBlur stdDeviation="20"/>
    </filter>

    <!-- Particle glow -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

        <feGaussianBlur stdDeviation="4"
                        result="blur"/>

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1280"
      height="190"
      rx="22"
      fill="url(#bg)"/>


<!-- ================================================= -->
<!-- PURPLE GLOW -->
<!-- ================================================= -->

<ellipse cx="250"
         cy="95"
         rx="360"
         ry="180"
         fill="url(#purpleGlow)"
         filter="url(#blur)">

    <animate attributeName="cx"
             values="220;390;220"
             dur="11s"
             repeatCount="indefinite"/>

    <animate attributeName="cy"
             values="95;65;95"
             dur="11s"
             repeatCount="indefinite"/>

</ellipse>


<!-- ================================================= -->
<!-- PINK GLOW -->
<!-- ================================================= -->

<ellipse cx="1030"
         cy="100"
         rx="350"
         ry="180"
         fill="url(#pinkGlow)"
         filter="url(#blur)">

    <animate attributeName="cx"
             values="1030;880;1030"
             dur="13s"
             repeatCount="indefinite"/>

    <animate attributeName="cy"
             values="100;130;100"
             dur="13s"
             repeatCount="indefinite"/>

</ellipse>


<!-- ================================================= -->
<!-- FLOWING BACKGROUND LINE -->
<!-- ================================================= -->

<path d="M-100 145
         C130 35 280 175 470 90
         C650 10 770 165 950 80
         C1080 20 1190 110 1380 55"
      fill="none"
      stroke="#C084FC"
      stroke-width="1.3"
      opacity=".13">

    <animate
        attributeName="d"
        dur="12s"
        repeatCount="indefinite"
        values="
        M-100 145 C130 35 280 175 470 90 C650 10 770 165 950 80 C1080 20 1190 110 1380 55;
        M-100 95 C130 165 280 30 470 125 C650 205 770 25 950 120 C1080 175 1190 60 1380 135;
        M-100 145 C130 35 280 175 470 90 C650 10 770 165 950 80 C1080 20 1190 110 1380 55"/>

</path>


<!-- ================================================= -->
<!-- SECOND SUBTLE LINE -->
<!-- ================================================= -->

<path d="M-80 50
         C150 150 280 15 490 75
         C680 130 820 25 1000 90
         C1130 135 1210 65 1360 105"
      fill="none"
      stroke="#E879F9"
      stroke-width="1"
      opacity=".07">

    <animate
        attributeName="stroke-dasharray"
        values="15 35;65 25;15 35"
        dur="8s"
        repeatCount="indefinite"/>

</path>


<!-- ================================================= -->
<!-- FLOATING PARTICLES -->
<!-- ================================================= -->

<g fill="#E879F9"
   filter="url(#glow)">

    <circle cx="120"
            cy="48"
            r="2">

        <animate attributeName="cy"
                 values="48;30;48"
                 dur="5s"
                 repeatCount="indefinite"/>

        <animate attributeName="opacity"
                 values=".2;1;.2"
                 dur="5s"
                 repeatCount="indefinite"/>

    </circle>


    <circle cx="1140"
            cy="135"
            r="2.3">

        <animate attributeName="cy"
                 values="135;110;135"
                 dur="6s"
                 repeatCount="indefinite"/>

        <animate attributeName="opacity"
                 values=".15;.9;.15"
                 dur="6s"
                 repeatCount="indefinite"/>

    </circle>


    <circle cx="660"
            cy="30"
            r="1.8">

        <animate attributeName="cy"
                 values="30;48;30"
                 dur="5s"
                 repeatCount="indefinite"/>

    </circle>


    <circle cx="220"
            cy="150"
            r="1.5">

        <animate attributeName="cx"
                 values="220;260;220"
                 dur="7s"
                 repeatCount="indefinite"/>

    </circle>

</g>


<!-- ================================================= -->
<!-- MAIN CARD -->
<!-- ================================================= -->

<rect x="10"
      y="10"
      width="1260"
      height="170"
      rx="22"
      fill="none"
      stroke="#89597E"
      stroke-width="1"
      opacity=".55"/>


<!-- ================================================= -->
<!-- CONTENT -->
<!-- ================================================= -->

<text x="640"
      y="82"
      text-anchor="middle"
      fill="url(#title)"
      font-family="Arial, Helvetica, sans-serif"
      font-size="30"
      font-weight="700"
      letter-spacing="3">

    LET'S CONNECT

</text>


<text x="640"
      y="110"
      text-anchor="middle"
      fill="#BDA8C2"
      font-family="Arial, Helvetica, sans-serif"
      font-size="12"
      letter-spacing="1.2">

    HAVE AN IDEA, PROJECT OR OPPORTUNITY?

</text>


<!-- ================================================= -->
<!-- DECORATIVE DIVIDER -->
<!-- ================================================= -->

<line x1="555"
      y1="137"
      x2="610"
      y2="137"
      stroke="#A855F7"
      stroke-width="1"
      opacity=".45"/>

<circle cx="640"
        cy="137"
        r="2.5"
        fill="#E879F9"
        filter="url(#glow)"/>

<line x1="670"
      y1="137"
      x2="725"
      y2="137"
      stroke="#C0268C"
      stroke-width="1"
      opacity=".45"/>


<!-- ================================================= -->
<!-- BORDER -->
<!-- ================================================= -->

<rect x="10"
      y="10"
      width="1260"
      height="170"
      rx="22"
      fill="none"
      stroke="#89597E"
      stroke-width="1"
      opacity=".55"/>

</svg>
