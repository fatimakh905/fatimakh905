<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="300"
     viewBox="0 0 1280 300">

<defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
        <stop offset="0%" stop-color="#100A16"/>
        <stop offset="45%" stop-color="#1B1024"/>
        <stop offset="100%" stop-color="#0D0812"/>
    </linearGradient>


    <!-- ================================================= -->
    <!-- AMBIENT GLOWS -->
    <!-- ================================================= -->

    <radialGradient id="purpleGlow">
        <stop offset="0%"
              stop-color="#C084FC"
              stop-opacity=".24"/>
        <stop offset="45%"
              stop-color="#A855F7"
              stop-opacity=".09"/>
        <stop offset="100%"
              stop-color="#A855F7"
              stop-opacity="0"/>
    </radialGradient>


    <radialGradient id="pinkGlow">
        <stop offset="0%"
              stop-color="#F0ABFC"
              stop-opacity=".18"/>
        <stop offset="50%"
              stop-color="#C0268C"
              stop-opacity=".06"/>
        <stop offset="100%"
              stop-color="#C0268C"
              stop-opacity="0"/>
    </radialGradient>


    <!-- ================================================= -->
    <!-- TITLE -->
    <!-- ================================================= -->

    <linearGradient id="title"
                    x1="0" y1="0"
                    x2="1" y2="0">
        <stop offset="0%"
              stop-color="#F5D0FE"/>
        <stop offset="50%"
              stop-color="#E879F9"/>
        <stop offset="100%"
              stop-color="#C084FC"/>
    </linearGradient>


    <!-- ================================================= -->
    <!-- ACCENT -->
    <!-- ================================================= -->

    <linearGradient id="accent"
                    x1="0" y1="0"
                    x2="1" y2="0">
        <stop offset="0%"
              stop-color="#C0268C"/>
        <stop offset="50%"
              stop-color="#A855F7"/>
        <stop offset="100%"
              stop-color="#E879F9"/>
    </linearGradient>


    <!-- ================================================= -->
    <!-- CARD -->
    <!-- ================================================= -->

    <linearGradient id="card"
                    x1="0" y1="0"
                    x2="1" y2="1">
        <stop offset="0%"
              stop-color="#28182F"/>
        <stop offset="100%"
              stop-color="#130C19"/>
    </linearGradient>


    <!-- ================================================= -->
    <!-- BLUR -->
    <!-- ================================================= -->

    <filter id="blur"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

        <feGaussianBlur stdDeviation="22"/>

    </filter>


    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

        <feGaussianBlur stdDeviation="4"
                        result="blur"/>

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1280"
      height="300"
      rx="22"
      fill="url(#bg)"/>


<!-- ================================================= -->
<!-- AMBIENT PURPLE -->
<!-- ================================================= -->

<ellipse cx="230"
         cy="150"
         rx="310"
         ry="190"
         fill="url(#purpleGlow)"
         filter="url(#blur)">

    <animate attributeName="cx"
             values="200;390;200"
             dur="11s"
             repeatCount="indefinite"/>

    <animate attributeName="cy"
             values="150;100;150"
             dur="11s"
             repeatCount="indefinite"/>

</ellipse>


<!-- ================================================= -->
<!-- AMBIENT PINK -->
<!-- ================================================= -->

<ellipse cx="1050"
         cy="145"
         rx="300"
         ry="190"
         fill="url(#pinkGlow)"
         filter="url(#blur)">

    <animate attributeName="cx"
             values="1050;880;1050"
             dur="13s"
             repeatCount="indefinite"/>

    <animate attributeName="cy"
             values="145;190;145"
             dur="13s"
             repeatCount="indefinite"/>

</ellipse>


<!-- ================================================= -->
<!-- FLOWING BACKGROUND LINE -->
<!-- ================================================= -->

<path d="M-80 235
         C140 90 270 250 470 145
         C650 50 760 230 940 130
         C1080 55 1190 160 1360 80"
      fill="none"
      stroke="#C084FC"
      stroke-width="1.5"
      opacity=".14">

    <animate
        attributeName="d"
        dur="12s"
        repeatCount="indefinite"
        values="
        M-80 235 C140 90 270 250 470 145 C650 50 760 230 940 130 C1080 55 1190 160 1360 80;
        M-80 180 C130 230 280 80 470 180 C650 280 760 80 950 170 C1100 250 1210 100 1360 150;
        M-80 235 C140 90 270 250 470 145 C650 50 760 230 940 130 C1080 55 1190 160 1360 80"/>

</path>


<!-- ================================================= -->
<!-- SECOND FLOWING LINE -->
<!-- ================================================= -->

<path d="M-100 95
         C130 210 260 45 450 115
         C650 190 760 50 960 125
         C1100 180 1190 90 1380 190"
      fill="none"
      stroke="#E879F9"
      stroke-width="1"
      opacity=".08">

    <animate
        attributeName="stroke-dasharray"
        values="10 35;60 25;10 35"
        dur="8s"
        repeatCount="indefinite"/>

</path>


<!-- ================================================= -->
<!-- FLOATING PARTICLES -->
<!-- ================================================= -->

<g fill="#E879F9"
   filter="url(#glow)">

    <circle cx="105"
            cy="85"
            r="2">

        <animate attributeName="cy"
                 values="85;60;85"
                 dur="5s"
                 repeatCount="indefinite"/>

        <animate attributeName="opacity"
                 values=".2;1;.2"
                 dur="5s"
                 repeatCount="indefinite"/>

    </circle>


    <circle cx="1170"
            cy="75"
            r="2.5">

        <animate attributeName="cy"
                 values="75;105;75"
                 dur="6s"
                 repeatCount="indefinite"/>

        <animate attributeName="opacity"
                 values=".15;.9;.15"
                 dur="6s"
                 repeatCount="indefinite"/>

    </circle>


    <circle cx="180"
            cy="230"
            r="1.8">

        <animate attributeName="cx"
                 values="180;230;180"
                 dur="7s"
                 repeatCount="indefinite"/>

    </circle>


    <circle cx="1100"
            cy="235"
            r="1.8">

        <animate attributeName="cx"
                 values="1100;1050;1100"
                 dur="7s"
                 repeatCount="indefinite"/>

    </circle>


    <circle cx="640"
            cy="35"
            r="2">

        <animate attributeName="cy"
                 values="35;55;35"
                 dur="5s"
                 repeatCount="indefinite"/>

    </circle>

</g>


<!-- ================================================= -->
<!-- MAIN CARD -->
<!-- ================================================= -->

<rect x="170"
      y="45"
      width="940"
      height="210"
      rx="24"
      fill="url(#card)"
      stroke="#815375"
      stroke-width="1"
      opacity=".97"/>


<!-- ================================================= -->
<!-- ACCENT BAR -->
<!-- ================================================= -->

<rect x="170"
      y="45"
      width="5"
      height="210"
      rx="2"
      fill="url(#accent)"/>


<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<text x="640"
      y="103"
      text-anchor="middle"
      fill="url(#title)"
      font-family="Arial, Helvetica, sans-serif"
      font-size="32"
      font-weight="700"
      letter-spacing="3">

    LET'S CONNECT

</text>


<!-- ================================================= -->
<!-- SUBTITLE -->
<!-- ================================================= -->

<text x="640"
      y="130"
      text-anchor="middle"
      fill="#BDA8C2"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      letter-spacing="1">

    HAVE AN IDEA, PROJECT OR OPPORTUNITY?

</text>



<!-- ================================================= -->
<!-- BORDER -->
<!-- ================================================= -->

<rect x="10"
      y="10"
      width="1260"
      height="280"
      rx="22"
      fill="none"
      stroke="#89597E"
      stroke-width="1"
      opacity=".7"/>

</svg>
